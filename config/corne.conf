# Corne split / nice!nano v2 / ZMK v0.3
CONFIG_ZMK_KEYBOARD_NAME="pabcorne"

# Reposo a los 30 segundos; deep sleep a los 5 minutos (milisegundos).
CONFIG_ZMK_IDLE_TIMEOUT=30000
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=300000

# Conservar el alcance y la compatibilidad BLE de la configuración original.
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_BT_CTLR_PHY_2M=n

# Sin iluminación ni pantalla para reducir consumo.
CONFIG_ZMK_RGB_UNDERGLOW=n
CONFIG_ZMK_BACKLIGHT=n
CONFIG_ZMK_DISPLAY=n
