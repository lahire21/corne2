# Uncomment the following lines to enable the Corne RGB Underglow
# CONFIG_ZMK_RGB_UNDERGLOW=y
# CONFIG_WS2812_STRIP=y

# Uncomment the following line to enable the Corne OLED Display
# CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_KEYBOARD_NAME="pabcorne"
#CONFIG_ZMK_SLEEP=y
#CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=1500000
#CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
#CONFIG_BT_CTLR_PHY_2M=n
#CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y

# Activar ZMK Studio en la rama main
CONFIG_ZMK_STUDIO=y

# Desactivar el candado de seguridad para emparejar directamente
CONFIG_ZMK_STUDIO_LOCKING=n

# Deep Sleep (Recomendado para ahorrar batería en reposo)
CONFIG_ZMK_SLEEP=n

# Habilitar el bus USB de manera nativa
CONFIG_USB_DEVICE_STACK=y
